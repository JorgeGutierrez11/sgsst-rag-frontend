# 1. DISPARADORES
name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:


# 2. PERMISOS Y CONCURRENCIA
# Public repository: the workflow token only reads code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# 3. VARIABLES GLOBALES
env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      # 4. PREPARACIÓN DEL ENTORNO
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm


      # 5. DEPENDENCIAS
      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      # 6. PRUEBAS
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # next build also fails on type errors, so a broken build never reaches the image workflow.
      - name: Build
        run: pnpm build
